<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khu Phố Hạnh Phúc — Mái Ấm Mùa Đông</title>

  <!-- Google Fonts hỗ trợ tiếng Việt mềm mại, ấm cúng -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import Map cho Three.js ES Module & OrbitControls -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --glass-bg: rgba(18, 24, 42, 0.62);
      --glass-border: rgba(255, 232, 198, 0.22);
      --warm-gold: #ffbe6b;
      --warm-amber: #ff944d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1224;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      color: #fdf6ec;
      user-select: none;
    }

    h1, h2, .font-display {
      font-family: 'Quicksand', 'Be Vietnam Pro', sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Phong cách kính mờ Glassmorphism ấm áp */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px rgba(5, 10, 24, 0.45), inset 0 1px 0 rgba(255, 245, 225, 0.12);
    }

    .btn-cozy {
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid rgba(255, 232, 198, 0.14);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-cozy:hover {
      background: rgba(255, 190, 107, 0.18);
      border-color: rgba(255, 190, 107, 0.45);
      transform: translateY(-1px);
    }

    .btn-cozy.active {
      background: linear-gradient(135deg, rgba(255, 166, 77, 0.85), rgba(235, 114, 62, 0.85));
      border-color: rgba(255, 226, 175, 0.75);
      color: #fffaf2;
      box-shadow: 0 4px 16px rgba(255, 148, 77, 0.38);
    }

    /* Toggle Switch mượt mà */
    .toggle-track {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 232, 198, 0.22);
      position: relative;
      transition: background 0.25s ease, border-color 0.25s ease;
      flex-shrink: 0;
    }

    .toggle-track.on {
      background: linear-gradient(135deg, #ffaa52, #e86f3a);
      border-color: rgba(255, 232, 198, 0.6);
    }

    .toggle-thumb {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff9f0;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toggle-track.on .toggle-thumb {
      transform: translateX(20px);
    }

    /* Thanh cuộn tinh tế cho bảng điều khiển trên màn hình nhỏ */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 210, 150, 0.28);
      border-radius: 999px;
    }

    /* Hiệu ứng bong bóng lời nhắn */
    #story-bubble {
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #story-bubble.hidden-bubble {
      opacity: 0;
      transform: translate(-50%, 18px) scale(0.95);
      pointer-events: none;
    }
    #story-bubble.visible-bubble {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    /* Sóng âm thanh nhỏ khi bật âm thanh ấm cúng */
    .eq-bar {
      width: 3px;
      background: #ffd18c;
      border-radius: 2px;
      animation: eqPulse 0.9s infinite ease-in-out;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eqPulse {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    /* Màn hình tải */
    #loading-screen {
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ khởi tạo khung cảnh 3D -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0b1224] px-6 text-center">
    <div class="w-16 h-16 mb-5 rounded-2xl bg-gradient-to-br from-amber-400/25 to-orange-500/20 border border-amber-300/35 flex items-center justify-center shadow-lg shadow-amber-500/15 animate-pulse">
      <svg class="w-9 h-9 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5.25 9.75V20.25h13.5V9.75M9.75 20.25v-6h4.5v6" />
      </svg>
    </div>
    <h2 class="font-display text-2xl sm:text-3xl font-bold text-amber-100 tracking-wide">Khu Phố Hạnh Phúc</h2>
    <p class="mt-2 text-sm text-amber-200/75">Đang nhóm bếp lò sưởi và thắp sáng mái ấm mùa đông...</p>
  </div>

  <!-- Khung chứa Canvas 3D -->
  <div id="canvas-container" aria-label="Cảnh 3D Khu Phố Hạnh Phúc Mùa Đông"></div>

  <!-- Tiêu đề nổi góc trên bên trái -->
  <header class="fixed top-3 left-3 sm:top-5 sm:left-5 z-20 max-w-[calc(100vw-5.5rem)] sm:max-w-md pointer-events-none">
    <div class="glass-panel rounded-2xl px-3.5 py-2.5 sm:px-4 sm:py-3 pointer-events-auto">
      <div class="flex items-center gap-2.5">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-amber-400/30 to-orange-500/30 border border-amber-300/40 text-amber-200 shadow-inner">
          <!-- Icon ngôi nhà ấm áp -->
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
            <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
          </svg>
        </span>
        <div class="min-w-0">
          <h1 class="font-display text-sm sm:text-base font-bold text-amber-50 leading-tight truncate">
            Khu Phố Hạnh Phúc — Mái Ấm Mùa Đông
          </h1>
          <p class="text-[11px] sm:text-xs text-amber-200/75 mt-0.5 truncate">
            Kéo xoay • Cuộn phóng to • Chạm vào gia đình &amp; đồ vật
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- Nút ẩn/hiện bảng điều khiển góc trên bên phải -->
  <div class="fixed top-3 right-3 sm:top-5 sm:right-5 z-30 flex items-center gap-2">
    <button id="btn-toggle-panel" type="button" class="glass-panel rounded-xl px-3 py-2.5 text-xs sm:text-sm font-medium text-amber-100 hover:bg-amber-400/20 transition flex items-center gap-2 cursor-pointer" title="Ẩn hoặc hiện bảng điều khiển">
      <svg id="icon-panel-toggle" class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
      </svg>
      <span id="label-panel-toggle" class="hidden sm:inline">Ẩn bảng</span>
    </button>
  </div>

  <!-- Bảng điều khiển tương tác Glassmorphism -->
  <aside id="control-panel" class="fixed top-16 right-3 sm:top-20 sm:right-5 z-20 w-[calc(100vw-1.5rem)] max-w-[310px] max-h-[calc(100vh-6rem)] overflow-y-auto custom-scroll glass-panel rounded-2xl p-3.5 sm:p-4 transition-all duration-300 origin-top-right">
    <div class="space-y-4">

      <!-- 1. Góc nhìn Camera -->
      <section>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-amber-200/80">Góc nhìn Camera</span>
          <span class="text-[10px] text-amber-200/55">Chuyển cảnh mượt</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" data-cam="neighborhood" class="cam-btn btn-cozy active rounded-xl px-2.5 py-2 text-left text-xs font-medium flex items-center gap-1.5 cursor-pointer">
            <span class="text-sm">🏘️</span>
            <span class="leading-tight">Toàn Cảnh Khu Phố</span>
          </button>
          <button type="button" data-cam="house" class="cam-btn btn-cozy rounded-xl px-2.5 py-2 text-left text-xs font-medium flex items-center gap-1.5 cursor-pointer">
            <span class="text-sm">🏡</span>
            <span class="leading-tight">Ngôi Nhà Ấm Áp</span>
          </button>
          <button type="button" data-cam="family" class="cam-btn btn-cozy rounded-xl px-2.5 py-2 text-left text-xs font-medium flex items-center gap-1.5 cursor-pointer">
            <span class="text-sm">👨‍👩‍👧‍👦</span>
            <span class="leading-tight">Gia Đình Quây Quần</span>
          </button>
          <button type="button" data-cam="fireplace" class="cam-btn btn-cozy rounded-xl px-2.5 py-2 text-left text-xs font-medium flex items-center gap-1.5 cursor-pointer">
            <span class="text-sm">🔥</span>
            <span class="leading-tight">Góc Lò Sưởi</span>
          </button>
        </div>
      </section>

      <hr class="border-amber-200/10" />

      <!-- 2. Mở tường xem nội thất (Cutaway) -->
      <section>
        <button id="btn-cutaway" type="button" class="w-full flex items-center justify-between gap-3 rounded-xl p-2.5 bg-white/5 hover:bg-amber-400/10 border border-amber-200/15 transition cursor-pointer">
          <div class="text-left">
            <div class="text-xs font-semibold text-amber-50">Mở tường xem bên trong</div>
            <div class="text-[11px] text-amber-200/65">Làm mờ mặt tiền lộ phòng khách</div>
          </div>
          <div id="toggle-cutaway" class="toggle-track">
            <div class="toggle-thumb"></div>
          </div>
        </button>
      </section>

      <!-- 3. Thời điểm trong ngày -->
      <section>
        <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-200/80 mb-2">Thời điểm trong ngày</div>
        <div class="grid grid-cols-3 gap-1.5">
          <button type="button" data-time="night" class="time-btn btn-cozy active rounded-xl py-2 px-1 text-center text-[11px] font-medium cursor-pointer">
            <div>🌙</div>
            <div class="mt-0.5 leading-tight">Đêm Tuyết Rơi</div>
          </button>
          <button type="button" data-time="sunset" class="time-btn btn-cozy rounded-xl py-2 px-1 text-center text-[11px] font-medium cursor-pointer">
            <div>🌅</div>
            <div class="mt-0.5 leading-tight">Hoàng Hôn</div>
          </button>
          <button type="button" data-time="morning" class="time-btn btn-cozy rounded-xl py-2 px-1 text-center text-[11px] font-medium cursor-pointer">
            <div>☀️</div>
            <div class="mt-0.5 leading-tight">Sáng Mùa Đông</div>
          </button>
        </div>
      </section>

      <!-- 4. Lượng tuyết rơi -->
      <section>
        <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-200/80 mb-2">Lượng tuyết rơi</div>
        <div class="grid grid-cols-3 gap-1.5">
          <button type="button" data-snow="light" class="snow-btn btn-cozy rounded-xl py-1.5 text-center text-xs font-medium cursor-pointer">Nhẹ</button>
          <button type="button" data-snow="medium" class="snow-btn btn-cozy active rounded-xl py-1.5 text-center text-xs font-medium cursor-pointer">Vừa</button>
          <button type="button" data-snow="heavy" class="snow-btn btn-cozy rounded-xl py-1.5 text-center text-xs font-medium cursor-pointer">Dày</button>
        </div>
      </section>

      <hr class="border-amber-200/10" />

      <!-- 5. Đèn lễ hội & Âm thanh ấm cúng -->
      <section class="space-y-2">
        <button id="btn-lights" type="button" class="w-full flex items-center justify-between rounded-xl px-2.5 py-2 bg-white/5 hover:bg-amber-400/10 border border-amber-200/10 transition cursor-pointer">
          <span class="text-xs font-medium text-amber-50 flex items-center gap-2">
            <span>✨</span> Đèn lễ hội &amp; trang trí
          </span>
          <div id="toggle-lights" class="toggle-track on">
            <div class="toggle-thumb"></div>
          </div>
        </button>

        <button id="btn-audio" type="button" class="w-full flex items-center justify-between rounded-xl px-2.5 py-2 bg-white/5 hover:bg-amber-400/10 border border-amber-200/10 transition cursor-pointer">
          <span class="text-xs font-medium text-amber-50 flex items-center gap-2">
            <span>🎵</span>
            <span>Âm thanh ấm cúng</span>
            <span id="audio-eq" class="hidden items-end gap-0.5 h-3.5 ml-1">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </span>
          </span>
          <div id="toggle-audio" class="toggle-track">
            <div class="toggle-thumb"></div>
          </div>
        </button>
      </section>

    </div>
  </aside>

  <!-- Bong bóng lời nhắn ấm áp khi nhấn vào nhân vật hoặc đồ vật -->
  <div id="story-bubble" class="hidden-bubble fixed bottom-5 left-1/2 z-30 w-[calc(100vw-2rem)] max-w-md glass-panel rounded-2xl px-4 py-3.5 shadow-2xl border-amber-300/35">
    <div class="flex items-start gap-3">
      <div id="story-icon" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-amber-400/30 to-orange-500/30 border border-amber-300/40 text-xl">
        💛
      </div>
      <div class="flex-1 min-w-0">
        <div id="story-title" class="font-display text-sm font-bold text-amber-200">Mái Ấm Gia Đình</div>
        <p id="story-text" class="mt-0.5 text-xs sm:text-sm text-amber-50/95 leading-relaxed"></p>
      </div>
      <button id="btn-close-story" type="button" class="p-1 text-amber-200/65 hover:text-amber-100 rounded-lg transition cursor-pointer" aria-label="Đóng lời nhắn">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Khung thông báo lỗi nhẹ nhàng (không bao giờ dùng alert) -->
  <div id="error-box" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
    <div class="glass-panel max-w-md rounded-2xl p-5 text-center">
      <h3 class="font-display text-lg font-bold text-amber-200">Không thể khởi tạo khung cảnh 3D</h3>
      <p id="error-msg" class="mt-2 text-sm text-amber-50/80"></p>
    </div>
  </div>

  <!-- Mã nguồn chính Three.js (ES Module) -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* =========================================================================
       1. TRẠNG THÁI ỨNG DỤNG & CẤU HÌNH TOÀN CỤC
    ========================================================================= */
    const state = {
      cutawayTarget: 0,       // 0 = đóng tường, 1 = mở tường lộ nội thất
      cutawayCurrent: 0,
      timeOfDay: 'night',     // 'night' | 'sunset' | 'morning'
      snowLevel: 'medium',    // 'light' | 'medium' | 'heavy'
      festiveLightsOn: true,
      audioOn: false,
      panelOpen: true,
      cameraAnim: null,       // { startPos, endPos, startTarget, endTarget, t, duration }
      storyTimeout: null,
      hoveredObj: null
    };

    // Các góc nhìn Camera mượt mà đã được căn chỉnh chuẩn xác theo phối cảnh
    const CAMERA_PRESETS = {
      neighborhood: {
        pos: new THREE.Vector3(16.5, 11.8, 22.5),
        target: new THREE.Vector3(0.0, 2.0, 2.0),
        autoCutaway: false
      },
      house: {
        pos: new THREE.Vector3(4.8, 4.3, 12.6),
        target: new THREE.Vector3(0.0, 2.5, 0.2),
        autoCutaway: false
      },
      family: {
        pos: new THREE.Vector3(0.25, 2.55, 8.2),
        target: new THREE.Vector3(-0.1, 1.55, -0.6),
        autoCutaway: true
      },
      fireplace: {
        pos: new THREE.Vector3(1.15, 1.85, 3.8),
        target: new THREE.Vector3(-1.75, 1.2, -0.75),
        autoCutaway: true
      }
    };

    // Bảng cấu hình ánh sáng & khí quyển cho 3 thời điểm trong ngày
    const TIME_PRESETS = {
      night: {
        skyTop: new THREE.Color(0x070d1f),
        skyMid: new THREE.Color(0x132042),
        skyHorizon: new THREE.Color(0x23335c),
        fogColor: new THREE.Color(0x14203d),
        fogDensity: 0.0145,
        hemiSky: new THREE.Color(0x4d6eb5),
        hemiGround: new THREE.Color(0x2d2438),
        hemiIntensity: 0.55,
        dirColor: new THREE.Color(0x9ec0ff),
        dirIntensity: 0.95,
        dirPos: new THREE.Vector3(-18, 26, 16),
        starsOpacity: 0.95,
        moonOpacity: 1.0,
        windowEmissive: 1.45,
        exposure: 1.15
      },
      sunset: {
        skyTop: new THREE.Color(0x2b2452),
        skyMid: new THREE.Color(0x9e4c62),
        skyHorizon: new THREE.Color(0xffa463),
        fogColor: new THREE.Color(0x6b475c),
        fogDensity: 0.0125,
        hemiSky: new THREE.Color(0xffb58a),
        hemiGround: new THREE.Color(0x4f394e),
        hemiIntensity: 0.78,
        dirColor: new THREE.Color(0xff9b5e),
        dirIntensity: 1.65,
        dirPos: new THREE.Vector3(-28, 12, 18),
        starsOpacity: 0.25,
        moonOpacity: 0.35,
        windowEmissive: 1.15,
        exposure: 1.1
      },
      morning: {
        skyTop: new THREE.Color(0x4b8ed6),
        skyMid: new THREE.Color(0x9acaf2),
        skyHorizon: new THREE.Color(0xfff1dc),
        fogColor: new THREE.Color(0xcde2f5),
        fogDensity: 0.010,
        hemiSky: new THREE.Color(0xdaf0ff),
        hemiGround: new THREE.Color(0x9ab0c7),
        hemiIntensity: 1.05,
        dirColor: new THREE.Color(0xfff4df),
        dirIntensity: 1.85,
        dirPos: new THREE.Vector3(20, 26, 18),
        starsOpacity: 0.0,
        moonOpacity: 0.0,
        windowEmissive: 0.55,
        exposure: 1.05
      }
    };

    /* =========================================================================
       2. HÀM TẠO TEXTURE PROCEDURAL (KHÔNG DÙNG ẢNH NGOÀI)
    ========================================================================= */
    function createGlowTexture(innerColor = 'rgba(255,230,170,1)', outerColor = 'rgba(255,160,60,0)') {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 62);
      g.addColorStop(0, innerColor);
      g.addColorStop(0.35, innerColor.replace(',1)', ',0.55)'));
      g.addColorStop(1, outerColor);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function createSnowflakeTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
      g.addColorStop(0, 'rgba(255,255,255,1)');

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    function createWoodFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b5a34';
      ctx.fillRect(0, 0, 512, 512);
      const rows = 10;
      const rh = 512 / rows;
      for (let i = 0; i < rows; i++) {
        const shade = (i % 3 === 0) ? '#96633b' : (i % 3 === 1 ? '#82522e' : '#8e5c35');
        ctx.fillStyle = shade;
        ctx.fillRect(0, i * rh + 1, 512, rh - 2);
        ctx.strokeStyle = 'rgba(55,30,12,0.45)';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, i * rh, 512, rh);
        // Đường vân gỗ mềm
        ctx.strokeStyle = 'rgba(120,75,38,0.22)';
        ctx.lineWidth = 1;
        for (let k = 0; k < 4; k++) {
          ctx.beginPath();
          ctx.moveTo(0, i * rh + (k + 1) * (rh / 5));
          ctx.bezierCurveTo(170, i * rh + k * 7, 340, i * rh + (k + 2) * 8, 512, i * rh + (k + 1) * (rh / 5));
          ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.colorSpace = THREE.SRGBColorSpace;

    function createBrickTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#cbbba8'; // vữa ấm
      ctx.fillRect(0, 0, 256, 256);
      const rows = 8;
      const cols = 4;
      const bh = 256 / rows;
      const bw = 256 / cols;
      const tones = ['#9d4838', '#8c3d30', '#ad5542', '#954334'];
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (bw / 2);
        for (let col = -1; col <= cols; col++) {
          ctx.fillStyle = tones[(r * 3 + col + 8) % tones.length];
          ctx.fillRect(col * bw + offset + 3, r * bh + 3, bw - 6, bh - 6);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2.5);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPaintingTexture() {

      ctx.fill();

      ctx.fillStyle = '#254a3b';

    function createCobbleTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#dde7f2'; // tuyết len giữa khe đá
      ctx.fillRect(0, 0, 256, 256);
      const stones = ['#7e8999', '#8e99a8', '#6f7b8c', '#98a4b3'];
      for (let r = 0; r < 8; r++) {

    /* =========================================================================
       3. HỆ THỐNG ÂM THANH ẤM CÚNG (WEB AUDIO API - KHÔNG FILE NGOÀI)
    ========================================================================= */
    class CozySoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isRunning = false;
        this.crackleTimer = null;
        this.melodyTimer = null;
        this.melodyIndex = 0;
        // Giai điệu hộp nhạc mùa đông êm dịu (tần số Hz, âm giai Trưởng ấm áp)
        this.notes = [
          523.25, 659.25, 783.99, 659.25,
          587.33, 698.46, 880.00, 698.46,
          523.25, 659.25, 783.99, 1046.50,
          987.77, 783.99, 659.25, 587.33
        ];
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        // 1. Tiếng lửa cháy ầm ĩ nhẹ & gió mùa đông vi vu từ buffer noise
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + 0.03 * white) / 1.03;
          lastOut = data[i];
          data[i] *= 2.5;
        }

        // Lò sưởi nền ấm (low rumble)
        const hearthSource = this.ctx.createBufferSource();
        hearthSource.buffer = noiseBuffer;
        hearthSource.loop = true;
        const hearthFilter = this.ctx.createBiquadFilter();
        hearthFilter.type = 'lowpass';
        hearthFilter.frequency.value = 190;
        const hearthGain = this.ctx.createGain();
        hearthGain.gain.value = 0.22;
        hearthSource.connect(hearthFilter).connect(hearthGain).connect(this.masterGain);
        hearthSource.start();

        // Gió mùa đông nhẹ ngoài hiên (bandpass có LFO dao động chậm)
        const windSource = this.ctx.createBufferSource();
        windSource.buffer = noiseBuffer;
        windSource.loop = true;
        const windFilter = this.ctx.createBiquadFilter();
        windFilter.type = 'bandpass';
        windFilter.frequency.value = 420;
        windFilter.Q.value = 2.6;
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.14;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 170;
        lfo.connect(lfoGain).connect(windFilter.frequency);
        lfo.start();
        const windGain = this.ctx.createGain();
        windGain.gain.value = 0.075;
        windSource.connect(windFilter).connect(windGain).connect(this.masterGain);
        windSource.start();
      }

      spawnCrackle() {
        if (!this.isRunning || !this.ctx) return;
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * (0.015 + Math.random() * 0.025));
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, 2.2);
          ch[i] = (Math.random() * 2 - 1) * env;
        }
        const src = this.ctx.createBufferSource();
        src.buffer = buf;

        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1400 + Math.random() * 2600;
        bp.Q.value = 1.6;

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.06 + Math.random() * 0.14, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

        src.connect(bp).connect(g).connect(this.masterGain);
        src.start(now);

        // Lên lịch tiếng củi nổ lách tách ngẫu nhiên tiếp theo
        this.crackleTimer = setTimeout(() => this.spawnCrackle(), 120 + Math.random() * 520);
      }

      playMusicBoxNote() {
        if (!this.isRunning || !this.ctx) return;
        const now = this.ctx.currentTime;
        const freq = this.notes[this.melodyIndex % this.notes.length];
        this.melodyIndex++;

        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        // Hòa âm chuông nhẹ ở quãng 8 trên
        const harmonic = this.ctx.createOscillator();
        harmonic.type = 'triangle';
        harmonic.frequency.setValueAtTime(freq * 2, now);

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.055, now + 0.025);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.85);

        const hg = this.ctx.createGain();
        hg.gain.setValueAtTime(0.012, now);
        hg.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

        osc.connect(g).connect(this.masterGain);
        harmonic.connect(hg).connect(this.masterGain);

        osc.start(now);
        harmonic.start(now);
        osc.stop(now + 1.9);
        harmonic.stop(now + 0.75);

        const stepMs = (this.melodyIndex % 4 === 0) ? 1250 : 720;
        this.melodyTimer = setTimeout(() => this.playMusicBoxNote(), stepMs);
      }

      setEnabled(enabled) {
        if (enabled) {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          this.isRunning = true;
          const now = this.ctx.currentTime;
          this.masterGain.gain.cancelScheduledValues(now);
          this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
          this.masterGain.gain.linearRampToValueAtTime(0.85, now + 0.6);
          clearTimeout(this.crackleTimer);
          clearTimeout(this.melodyTimer);
          this.spawnCrackle();
          this.playMusicBoxNote();
        } else {
          this.isRunning = false;
          clearTimeout(this.crackleTimer);
          clearTimeout(this.melodyTimer);
          if (this.ctx && this.masterGain) {
            const now = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(now);
            this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
            this.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
          }
        }
      }
    }

    // Tiện ích gắn material hỗ trợ Cutaway mượt mà
    function registerCutawayObject(obj) {
      cutawayGroup.add(obj);
      obj.traverse((child) => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          const cloned = mats.map((m) => {
            const c = m.clone();
            c.userData.baseOpacity = c.opacity !== undefined ? c.opacity : 1;
            c.userData.baseTransparent = !!c.transparent;
            cutawayMaterials.push(c);
            return c;
          });
          child.material = Array.isArray(child.material) ? cloned : cloned[0];
        }
      });
    }

    function buildSkyAndMoon() {
      // Vòm trời gradient shader mượt mà
      skyUniforms = {
        topColor: { value: TIME_PRESETS.night.skyTop.clone() },
        midColor: { value: TIME_PRESETS.night.skyMid.clone() },
        horizonColor: { value: TIME_PRESETS.night.skyHorizon.clone() }
      };

      const skyMat = new THREE.ShaderMaterial({
        uniforms: skyUniforms,
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 midColor;
          uniform vec3 horizonColor;
          varying vec3 vWorldPos;
          void main() {
            float h = normalize(vWorldPos).y;
            vec3 col = mix(horizonColor, midColor, smoothstep(-0.05, 0.28, h));
            col = mix(col, topColor, smoothstep(0.25, 0.78, h));
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(95, 32, 20), skyMat));

      // Bầu trời sao lấp lánh
      const starCount = 520;
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(0.18 + Math.random() * 0.82);
        const r = 82 + Math.random() * 6;
        starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = r * Math.cos(phi);
        starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starMaterial = new THREE.PointsMaterial({
        size: 1.15,
        map: snowTex,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        color: 0xfff6e5
      });
      scene.add(new THREE.Points(starGeo, starMaterial));

      // Vầng trăng dịu nhẹ có quầng sáng
      const moonGroup = new THREE.Group();
      moonGroup.position.set(-28, 34, -44);
      const moonMat = new THREE.MeshBasicMaterial({ color: 0xfff5db, transparent: true, opacity: 1 });
      moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3.4, 24, 24), moonMat);
      moonGroup.add(moonMesh);

      const haloMat = new THREE.SpriteMaterial({
        map: createGlowTexture('rgba(255,244,214,0.85)', 'rgba(180,208,255,0)'),
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      moonHalo = new THREE.Sprite(haloMat);
      moonHalo.scale.set(22, 22, 1);
      moonGroup.add(moonHalo);
      scene.add(moonGroup);
    }

    function buildTerrainAndRoad() {
      // Nền tuyết rộng với gò đồi mềm xung quanh rìa khu phố
      const groundGeo = new THREE.PlaneGeometry(130, 130, 72, 72);
      groundGeo.rotateX(-Math.PI / 2);
      const pos = groundGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const dist = Math.hypot(x, z - 4);
        if (dist > 22) {
          const t = Math.min(1, (dist - 22) / 28);
          const hill = (Math.sin(x * 0.11) * Math.cos(z * 0.11) * 2.2 + 2.6) * t * t;
          pos.setY(i, hill);
        } else {
          // Gợn tuyết cực nhẹ ở sân vườn, giữ trung tâm phẳng để đặt nhà
          const micro = (dist > 8) ? (Math.sin(x * 0.35) * Math.cos(z * 0.35) * 0.04) : 0;
          pos.setY(i, micro);
        }
      }
      groundGeo.computeVertexNormals();
      const snowGroundMat = new THREE.MeshStandardMaterial({
        color: 0xeaf2fc,
        roughness: 0.88,
        metalness: 0.02
      });
      const ground = new THREE.Mesh(groundGeo, snowGroundMat);
      ground.receiveShadow = true;
      scene.add(ground);

      // Con đường lát đá uốn lượn nhẹ phía trước khu phố (z ~ 9.5)
      const roadCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-34, 0.03, 12.2),
        new THREE.Vector3(-18, 0.03, 10.6),
        new THREE.Vector3(-6, 0.03, 9.6),
        new THREE.Vector3(6, 0.03, 9.5),
        new THREE.Vector3(18, 0.03, 10.7),
        new THREE.Vector3(34, 0.03, 12.6)
      ]);

      const roadShapePts = roadCurve.getSpacedPoints(70);
      const roadPositions = [];
      const roadUvs = [];
      const roadIndices = [];
      const roadHalfWidth = 2.05;

      for (let i = 0; i < roadShapePts.length; i++) {
        const p = roadShapePts[i];
        const tan = roadCurve.getTangent(i / (roadShapePts.length - 1));
        const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        const left = p.clone().addScaledVector(normal, roadHalfWidth);
        const right = p.clone().addScaledVector(normal, -roadHalfWidth);
        roadPositions.push(left.x, left.y, left.z, right.x, right.y, right.z);
        const u = i / (roadShapePts.length - 1);
        roadUvs.push(u, 0, u, 1);
        if (i < roadShapePts.length - 1) {
          const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
          roadIndices.push(a, b, c, b, d, c);
        }
      }

      const roadGeo = new THREE.BufferGeometry();
      roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
      roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUvs, 2));
      roadGeo.setIndex(roadIndices);
      roadGeo.computeVertexNormals();

      const roadMat = new THREE.MeshStandardMaterial({
        map: createCobbleTexture(),
        roughness: 0.9,
        metalness: 0.05
      });
      const roadMesh = new THREE.Mesh(roadGeo, roadMat);
      roadMesh.receiveShadow = true;
      scene.add(roadMesh);

      // Lối đi đá nhỏ phủ tuyết nối từ bậc thềm ngôi nhà chính ra con đường
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xa4adb9, roughness: 0.85 });
      for (let i = 0; i < 6; i++) {
        const stepStone = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.07, 10), stoneMat);
        stepStone.position.set(Math.sin(i * 0.7) * 0.14, 0.035, 4.6 + i * 0.78);
        stepStone.scale.set(1.25, 1, 0.78);
        stepStone.receiveShadow = true;
        scene.add(stepStone);
      }

      // Khoảng sân tròn nhỏ công viên khu phố phía đối diện ngôi nhà chính
      const plaza = new THREE.Mesh(
        new THREE.CylinderGeometry(4.6, 4.8, 0.06, 28),
        new THREE.MeshStandardMaterial({ color: 0xd4dee9, roughness: 0.88 })
      );
      plaza.position.set(-4.2, 0.03, 16.5);
      plaza.receiveShadow = true;
      scene.add(plaza);
    }

      // 5. Dây đèn vàng trang trí rủ mềm dọc mái hiên

    function buildHeroFrontYard(darkWoodMat, snowMat) {
      const yard = new THREE.Group();
      scene.add(yard);

      // Sàn hiên & bậc thềm phủ tuyết nhẹ
      const porchDeck = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.38, 1.55), darkWoodMat);
      porchDeck.position.set(0, 0.19, 4.02);
      porchDeck.receiveShadow = true;

      const step1 = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.18, 0.45), darkWoodMat);
      step1.position.set(0, 0.09, 4.95);
      step1.receiveShadow = true;
      yard.add(step1);

      // Mảng tuyết mềm hai bên bậc thềm
      [-1.15, 1.15].forEach((sx) => {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), snowMat);
        puff.scale.set(1.4, 0.35, 1.0);
        puff.position.set(sx, 0.42, 4.55);
        yard.add(puff);
      });

      // Hàng rào gỗ trắng bao quanh sân trước (chừa lối đi ở giữa)
      const fenceMat = new THREE.MeshStandardMaterial({ color: 0xf7f5f0, roughness: 0.78 });
      function addFenceSegment(x1, z1, x2, z2) {
        const dist = Math.hypot(x2 - x1, z2 - z1);
        const angle = Math.atan2(x2 - x1, z2 - z1);
        const seg = new THREE.Group();
        seg.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
        seg.rotation.y = angle;

        // 2 thanh ngang
        [0.28, 0.68].forEach((ry) => {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, dist), fenceMat);
          rail.position.y = ry;
          rail.castShadow = true;
          seg.add(rail);
        });

        // Các cọc gỗ nhọn đầu
        const count = Math.max(2, Math.floor(dist / 0.48));
        for (let i = 0; i <= count; i++) {
          const zOff = -dist / 2 + (i / count) * dist;
          const picket = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.92, 0.13), fenceMat);
          picket.position.set(0, 0.46, zOff);
          picket.castShadow = true;
          seg.add(picket);
          const capSnow = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), snowMat);
          capSnow.scale.set(1, 0.55, 1.1);
          capSnow.position.set(0, 0.94, zOff);
          seg.add(capSnow);
        }
        yard.add(seg);
      }

      addFenceSegment(-5.4, 7.2, -1.35, 7.2);
      addFenceSegment(1.35, 7.2, 5.4, 7.2);
      addFenceSegment(-5.4, 7.2, -5.4, 1.5);
      addFenceSegment(5.4, 7.2, 5.4, 1.5);

      // Hộp thư đỏ dễ thương trước sân bên trái lối đi
      const mailbox = new THREE.Group();
      mailbox.position.set(-1.85, 0, 7.45);
      const mbPost = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.15, 8), darkWoodMat);
      mbPost.position.y = 0.57;
      mbPost.castShadow = true;
      mailbox.add(mbPost);
      const mbBox = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.28, 0.48),
        new THREE.MeshStandardMaterial({ color: 0xc93838, roughness: 0.45 })
      );
      mbBox.position.set(0, 1.22, 0.05);
      mbBox.castShadow = true;
      mailbox.add(mbBox);
      const mbSnow = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.07, 0.5), snowMat);
      mbSnow.position.set(0, 1.38, 0.05);

    function buildSnowman(scale = 1.0) {
      const sm = new THREE.Group();
      const sMat = new THREE.MeshStandardMaterial({ color: 0xf7fbff, roughness: 0.72 });

      const bottom = new THREE.Mesh(new THREE.SphereGeometry(0.56, 18, 16), sMat);

      sm.add(bottom);

      const mid = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 14), sMat);
      mid.position.y = 1.18;
      mid.castShadow = true;

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, 16, 14), sMat);

      nose.rotation.x = Math.PI / 2;
      nose.position.set(0, 1.72, 0.34);

      // Mắt & cúc áo than đá
      [-0.1, 0.1].forEach((ex) => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.036, 8, 8), coalMat);
        eye.position.set(ex, 1.8, 0.25);

        const btn = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), coalMat);
        btn.position.set(0, by, 0.38);
        sm.add(btn);
      });

      // Khăn quàng đỏ
      const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.075, 10, 20), redMat);
      scarf.rotation.x = Math.PI / 2;
      scarf.position.y = 1.48;
      sm.add(scarf);

      scarfTail.position.set(0.18, 1.32, 0.28);
      scarfTail.rotation.z = -0.22;

      // Mũ phớt đen xinh xắn
      const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.05, 16), coalMat);
      hatBrim.position.y = 1.98;
      sm.add(hatBrim);
      const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.32, 16), coalMat);
      hatTop.position.y = 2.15;

      // Cánh tay cành cây
      [-1, 1].forEach((s) => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.032, 0.65, 6), twigMat);
        arm.position.set(s * 0.56, 1.28, 0.04);
        arm.rotation.z = s * -1.05;
        sm.add(arm);
      });

      sm.scale.setScalar(scale);
      return sm;

    function createGiftBox(w, h, d, boxCol, ribbonCol) {

      box.castShadow = true;
      g.add(box);

      const r2 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.18, h + 0.02, d + 0.02), rMat);

      const bow = new THREE.Mesh(new THREE.TorusKnotGeometry(Math.min(w, d) * 0.16, 0.022, 24, 6), rMat);
      bow.position.y = h / 2 + 0.04;

    function buildChristmasTree(scale = 1.0, addSnow = false) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 0.2, 0.65, 10),
        new THREE.MeshStandardMaterial({ color: 0x5c371d, roughness: 0.9 })
      );
      trunk.position.y = 0.32;
      tree.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x1e5c38, roughness: 0.85 });
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xf4f8ff, roughness: 0.78 });
      const layers = [
        { y: 1.05, r: 1.02, h: 1.15 },
        { y: 1.72, r: 0.82, h: 1.05 },
        { y: 2.32, r: 0.6, h: 0.92 },
        { y: 2.82, r: 0.36, h: 0.7 }
      ];

      layers.forEach((l, li) => {
        const cone = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 14), leafMat);
        cone.position.y = l.y;
        cone.castShadow = true;
        tree.add(cone);

        if (addSnow) {
          const cap = new THREE.Mesh(new THREE.ConeGeometry(l.r * 0.84, l.h * 0.45, 14), snowMat);
          cap.position.y = l.y + l.h * 0.28;
          tree.add(cap);
        }

        // Quả châu & đèn nhỏ lấp lánh quanh mỗi tầng lá
        const ornColors = [0xff4d5a, 0xffcc4d, 0x56cfe1, 0xff9f43, 0xfff3c4];
        const count = 8 - li;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + li * 0.6;
          const rad = l.r * 0.78;
          const isLight = i % 2 === 0;
          const col = ornColors[(i + li * 2) % ornColors.length];
          const mat = isLight
            ? new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 2.0 })
            : new THREE.MeshStandardMaterial({ color: col, metalness: 0.6, roughness: 0.25 });
          const orb = new THREE.Mesh(new THREE.SphereGeometry(isLight ? 0.048 : 0.068, 10, 10), mat);
          orb.position.set(Math.cos(ang) * rad, l.y - l.h * 0.24, Math.sin(ang) * rad);
          tree.add(orb);
          if (isLight) {
            festiveLights.push({
              mat,
              baseIntensity: 2.0,
              phase: Math.random() * Math.PI * 2,
              speed: 2.2 + Math.random() * 2.5
            });
          }
        }
      });

      // Ngôi sao vàng phát sáng trên đỉnh cây thông
      const starMat = new THREE.MeshStandardMaterial({
        color: 0xffe478, emissive: 0xffbe3b, emissiveIntensity: 2.2, roughness: 0.2
      });
      const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), starMat);
      star.position.y = 3.3;
      star.scale.set(1, 1.15, 0.45);
      tree.add(star);
      festiveLights.push({ mat: starMat, baseIntensity: 2.2, phase: 0, speed: 1.8 });

      const starHalo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: warmGlowTex, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      starHalo.scale.set(1.15, 1.15, 1);
      starHalo.position.y = 3.3;
      tree.add(starHalo);
      festiveLights.push({ sprite: starHalo, baseOpacity: 0.85, phase: 0.5, speed: 1.8 });

      tree.scale.setScalar(scale);
      return tree;
    }

    /* =========================================================================
       7. TẠO NHÂN VẬT GIA ĐÌNH STYLIZED ẤM ÁP & CHÚ CÚN CƯNG
    ========================================================================= */
    function createStylizedPerson(opts) {
      const {
        scale = 1.0,
        sweaterColor = 0x3b6e5c,
        stripeColor = 0xf4e4c9,
        pantsColor = 0x3a4052,
        skinColor = 0xf7cbb0,
        hairColor = 0x3d281c,
        hairStyle = 'short',    // 'short' | 'bob' | 'bun' | 'pigtails' | 'elder'
        hasGlasses = false,
        hasMustache = false,
        pose = 'seated',        // 'seated' | 'floor' | 'standing'
        holdMug = false,
        holdTeddy = false
      } = opts;

      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.65 });
      const sweaterMat = new THREE.MeshStandardMaterial({ color: sweaterColor, roughness: 0.85 });
      const stripeMat = new THREE.MeshStandardMaterial({ color: stripeColor, roughness: 0.85 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.88 });
      const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });
      const cheekMat = new THREE.MeshStandardMaterial({ color: 0xf2938c, roughness: 0.7 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1718, roughness: 0.2 });

      // Thân áo len mềm mại hình trụ bo tròn
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 0.52, 14), sweaterMat);
      torso.position.y = 0.42;
      torso.castShadow = true;
      bodyGroup.add(torso);

      // Họa tiết kẻ ngang áo len mùa đông & cổ áo ấm
      const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.22, 0.11, 14), stripeMat);
      stripe.position.y = 0.45;
      bodyGroup.add(stripe);

      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.048, 8, 16), stripeMat);
      collar.rotation.x = Math.PI / 2;
      collar.position.y = 0.67;
      bodyGroup.add(collar);

      // Chân theo tư thế ngồi sofa / ngồi thảm / đứng
      [-0.1, 0.1].forEach((lx) => {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.072, 0.28, 6, 10), pantsMat);
        if (pose === 'seated') {
          leg.rotation.x = Math.PI / 2.2;
          leg.position.set(lx, 0.17, 0.2);
          const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, 0.24, 6, 10), pantsMat);
          shin.position.set(lx, 0.0, 0.34);
          bodyGroup.add(shin);
        } else if (pose === 'floor') {
          leg.rotation.x = Math.PI / 2;
          leg.rotation.z = lx > 0 ? -0.45 : 0.45;
          leg.position.set(lx * 1.35, 0.12, 0.22);
        } else {
          leg.position.set(lx, 0.02, 0);
        }
        bodyGroup.add(leg);
      });

      // Hai cánh tay
      [-1, 1].forEach((side) => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.058, 0.26, 6, 10), sweaterMat);
        arm.position.set(side * 0.24, 0.46, holdMug && side === 1 ? 0.12 : 0.05);
        arm.rotation.z = side * 0.28;
        arm.rotation.x = (holdMug && side === 1) ? -0.9 : (pose === 'floor' ? -0.65 : -0.35);
        bodyGroup.add(arm);

        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.056, 10, 10), skinMat);
        hand.position.set(
          side * 0.25,
          holdMug && side === 1 ? 0.42 : 0.31,
          holdMug && side === 1 ? 0.28 : 0.16
        );
        bodyGroup.add(hand);
      });

      // Cầm tách cacao ấm
      if (holdMug) {
        const mug = createCocoaMug(0xfff4e0);
        mug.scale.setScalar(0.85);
        mug.position.set(0.24, 0.38, 0.32);
        bodyGroup.add(mug);
      }

      // Ôm chú gấu bông nhỏ (dành cho bé gái)
      if (holdTeddy) {
        const teddy = new THREE.Group();
        const bearMat = new THREE.MeshStandardMaterial({ color: 0xb57a4a, roughness: 0.92 });
        const tb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), bearMat);
        const th = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 10), bearMat);
        th.position.y = 0.14;
        const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), bearMat);
        e1.position.set(-0.06, 0.21, 0);
        const e2 = e1.clone(); e2.position.x = 0.06;
        teddy.add(tb, th, e1, e2);
        teddy.position.set(0.04, 0.34, 0.24);
        bodyGroup.add(teddy);
      }

      // Đầu nhân vật (tách riêng để xoay nhẹ gật đầu trò chuyện)
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 0.86, 0.02);
      bodyGroup.add(headGroup);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 18, 16), skinMat);
      head.castShadow = true;
      headGroup.add(head);

      // Mắt long lanh + má hồng + nụ cười hiền hậu
      [-0.075, 0.075].forEach((ex) => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 10), eyeMat);
        eye.position.set(ex, 0.025, 0.195);
        headGroup.add(eye);
        const glint = new THREE.Mesh(
          new THREE.SphereGeometry(0.009, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        glint.position.set(ex + 0.009, 0.034, 0.217);
        headGroup.add(glint);

        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), cheekMat);
        cheek.scale.set(1.2, 0.7, 0.5);
        cheek.position.set(ex * 1.45, -0.025, 0.185);
        headGroup.add(cheek);
      });

      const smile = new THREE.Mesh(
        new THREE.TorusGeometry(0.042, 0.009, 6, 12, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0xa84845, roughness: 0.6 })
      );
      smile.rotation.z = Math.PI;
      smile.position.set(0, -0.04, 0.202);
      headGroup.add(smile);

      // Kiểu tóc đặc trưng từng thành viên
      if (hairStyle === 'short' || hairStyle === 'elder') {
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.232, 16, 14, 0, Math.PI * 2, 0, Math.PI * 0.58),
          hairMat
        );
        cap.position.y = 0.02;
        headGroup.add(cap);
      } else if (hairStyle === 'bob') {
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.238, 16, 14), hairMat);
        cap.position.set(0, 0.02, -0.03);
        headGroup.add(cap);
        [-0.18, 0.18].forEach((sx) => {
          const sideHair = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.16, 6, 8), hairMat);
          sideHair.position.set(sx, -0.06, -0.02);
          headGroup.add(sideHair);
        });
      } else if (hairStyle === 'bun') {
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.235, 16, 14, 0, Math.PI * 2, 0, Math.PI * 0.62),
          hairMat
        );
        cap.position.set(0, 0.02, -0.01);
        headGroup.add(cap);
        const bun = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), hairMat);
        bun.position.set(0, 0.18, -0.16);
        headGroup.add(bun);
      } else if (hairStyle === 'pigtails') {
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.232, 16, 14, 0, Math.PI * 2, 0, Math.PI * 0.62),
          hairMat
        );
        cap.position.y = 0.02;
        headGroup.add(cap);
        const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.5 });
        [-0.22, 0.22].forEach((px) => {
          const tail = new THREE.Mesh(new THREE.SphereGeometry(0.088, 10, 10), hairMat);
          tail.position.set(px, 0.02, -0.04);
          headGroup.add(tail);
          const rib = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), ribbonMat);
          rib.position.set(px * 0.88, 0.09, -0.02);
          headGroup.add(rib);
        });
      }

      // Kính lão vàng ấm cho Ông & Bà
      if (hasGlasses) {
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xd9b36c, metalness: 0.7, roughness: 0.3 });
        [-0.075, 0.075].forEach((gx) => {
          const rim = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.008, 6, 16), glassMat);
          rim.position.set(gx, 0.025, 0.215);
          headGroup.add(rim);
        });
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 0.01), glassMat);
        bridge.position.set(0, 0.03, 0.218);
        headGroup.add(bridge);
      }

      // Ria mép bạc hiền hậu cho Ông
      if (hasMustache) {
        const stache = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.09, 6, 8), hairMat);
        stache.rotation.z = Math.PI / 2;
        stache.position.set(0, -0.022, 0.212);
        headGroup.add(stache);
      }

      root.scale.setScalar(scale);
      root.userData.headGroup = headGroup;
      root.userData.bodyGroup = bodyGroup;
      return root;
    }

    function buildSnowyPine(scale = 1.0) {
      const p = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.24, 1.0, 8),
        new THREE.MeshStandardMaterial({ color: 0x4f321e, roughness: 0.9 })

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x24543d, roughness: 0.88 });
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xf0f6ff, roughness: 0.8 });

      [
        { y: 1.55, r: 1.45, h: 1.85 },
        { y: 2.65, r: 1.12, h: 1.6 },
        { y: 3.6, r: 0.76, h: 1.25 }

        p.add(c);
        const s = new THREE.Mesh(new THREE.ConeGeometry(t.r * 0.8, t.h * 0.48, 9), snowMat);
        s.position.y = t.y + t.h * 0.27;
        p.add(s);
      });

      p.scale.setScalar(scale);
      return p;

    function createFestiveStringLights(pStart, pEnd, count, sag, colors, parent) {
      const pts = [];
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = new THREE.Vector3().lerpVectors(pStart, pEnd, t);
        p.y -= Math.sin(t * Math.PI) * sag;
        pts.push(p);
      }

      // Sợi dây mảnh tối màu
      const curve = new THREE.CatmullRomCurve3(pts);
      const wire = new THREE.Mesh(
        new THREE.TubeGeometry(curve, count * 2, 0.014, 5, false),
        new THREE.MeshBasicMaterial({ color: 0x222630 })
      );
      parent.add(wire);

      // Các bóng đèn nhỏ phát sáng ấm áp
      const bulbGeo = new THREE.SphereGeometry(0.055, 8, 8);
      for (let i = 1; i < count; i++) {
        const col = colors[i % colors.length];
        const mat = new THREE.MeshStandardMaterial({
          color: col,
          emissive: col,
          emissiveIntensity: 2.0,
          roughness: 0.25
        });
        const bulb = new THREE.Mesh(bulbGeo, mat);
        bulb.position.copy(pts[i]);
        bulb.position.y -= 0.045;
        parent.add(bulb);

        festiveLights.push({
          mat,
          baseIntensity: 2.0,
          phase: i * 0.65 + Math.random(),
          speed: 2.0 + Math.random() * 1.8
        });
      }
    }

    function buildSnowSystem() {

    function updateSnowLevel(level) {
      state.snowLevel = level;
      if (!snowPoints) return;
      if (level === 'light') {
        snowPoints.geometry.setDrawRange(0, 620);
        snowPoints.material.size = 0.2;
      } else if (level === 'medium') {
        snowPoints.geometry.setDrawRange(0, 1550);

      } else {
        snowPoints.geometry.setDrawRange(0, snowCountMax);

      }

    /* =========================================================================
       10. TƯƠNG TÁC RAYCASTER & BONG BÓNG LỜI NHẮN TIẾNG VIỆT
    ========================================================================= */
    function setupRaycaster() {
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downX = 0, downY = 0;

      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
      });

      dom.addEventListener('pointerup', (e) => {
        // Chỉ tính là click khi người dùng không kéo xoay camera
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;

        const rect = dom.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(interactables, false);
        if (hits.length > 0) {
          const hit = hits[0].object;
          if (hit.userData && hit.userData.story) {
            showStoryBubble(hit.userData.story);
          }
        }
      });

      // Thay đổi con trỏ chuột khi rà qua đối tượng có thể nhấn
      dom.addEventListener('pointermove', (e) => {
        if (e.buttons > 0) return;
        const rect = dom.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(interactables, false);
        dom.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
      });
    }

    function showStoryBubble(story) {
      const bubble = document.getElementById('story-bubble');
      document.getElementById('story-icon').textContent = story.icon;
      document.getElementById('story-title').textContent = story.title;
      document.getElementById('story-text').textContent = story.text;

      bubble.classList.remove('hidden-bubble');
      bubble.classList.add('visible-bubble');

      clearTimeout(state.storyTimeout);
      state.storyTimeout = setTimeout(() => hideStoryBubble(), 6800);
    }

    function hideStoryBubble() {
      const bubble = document.getElementById('story-bubble');
      bubble.classList.remove('visible-bubble');
      bubble.classList.add('hidden-bubble');
    }

    function animateCameraTo(presetKey) {
      const preset = CAMERA_PRESETS[presetKey];
      if (!preset) return;

      state.cameraAnim = {
        startPos: camera.position.clone(),
        endPos: preset.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: preset.target.clone(),
        t: 0,
        duration: 1.35
      };

      // Tự động mở tường khi chọn góc nhìn Gia đình hoặc Góc Lò Sưởi
      if (preset.autoCutaway) {
        setCutaway(true);
      } else if (presetKey === 'neighborhood' || presetKey === 'house') {
        setCutaway(false);
      }

      document.querySelectorAll('.cam-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.cam === presetKey);
      });
    }

    function setCutaway(enabled) {
      state.cutawayTarget = enabled ? 1 : 0;
      document.getElementById('toggle-cutaway').classList.toggle('on', enabled);
    }

    function setupUI() {
      // Nút chuyển góc nhìn Camera
      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.addEventListener('click', () => animateCameraTo(btn.dataset.cam));
      });

      // Nút bật/tắt Mở tường xem bên trong
      document.getElementById('btn-cutaway').addEventListener('click', () => {
        setCutaway(state.cutawayTarget < 0.5);
      });

      // Nút thời điểm trong ngày
      document.querySelectorAll('.time-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.timeOfDay = btn.dataset.time;
          document.querySelectorAll('.time-btn').forEach((b) => b.classList.toggle('active', b === btn));
        });
      });

      // Nút lượng tuyết rơi
      document.querySelectorAll('.snow-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          updateSnowLevel(btn.dataset.snow);
          document.querySelectorAll('.snow-btn').forEach((b) => b.classList.toggle('active', b === btn));
        });
      });

      // Nút bật/tắt đèn lễ hội
      document.getElementById('btn-lights').addEventListener('click', () => {
        state.festiveLightsOn = !state.festiveLightsOn;
        document.getElementById('toggle-lights').classList.toggle('on', state.festiveLightsOn);
      });

      // Nút bật/tắt âm thanh ấm cúng
      document.getElementById('btn-audio').addEventListener('click', () => {
        state.audioOn = !state.audioOn;
        document.getElementById('toggle-audio').classList.toggle('on', state.audioOn);
        const eq = document.getElementById('audio-eq');
        eq.classList.toggle('hidden', !state.audioOn);
        eq.classList.toggle('flex', state.audioOn);
        soundEngine.setEnabled(state.audioOn);
      });

      // Nút ẩn/hiện bảng điều khiển
      const panel = document.getElementById('control-panel');
      const labelToggle = document.getElementById('label-panel-toggle');
      document.getElementById('btn-toggle-panel').addEventListener('click', () => {
        state.panelOpen = !state.panelOpen;
        if (state.panelOpen) {
          panel.style.opacity = '1';
          panel.style.transform = 'scale(1)';
          panel.style.pointerEvents = 'auto';
          labelToggle.textContent = 'Ẩn bảng';
        } else {
          panel.style.opacity = '0';
          panel.style.transform = 'scale(0.92)';
          panel.style.pointerEvents = 'none';
          labelToggle.textContent = 'Điều khiển';
        }
      });

      // Thu gọn bảng mặc định trên màn hình điện thoại nhỏ để nhìn trọn cảnh 3D
      if (window.innerWidth < 640) {
        state.panelOpen = false;
        panel.style.opacity = '0';
        panel.style.transform = 'scale(0.92)';
        panel.style.pointerEvents = 'none';
        labelToggle.textContent = 'Điều khiển';
      }

      // Đóng bong bóng lời nhắn
      document.getElementById('btn-close-story').addEventListener('click', hideStoryBubble);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* =========================================================================
       12. VÒNG LẶP HOẠT ẢNH 60FPS
    ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. Chuyển cảnh Camera mượt mà (Cubic ease-in-out)
      if (state.cameraAnim) {
        const a = state.cameraAnim;
        a.t = Math.min(1, a.t + dt / a.duration);
        const ease = a.t < 0.5 ? 4 * a.t * a.t * a.t : 1 - Math.pow(-2 * a.t + 2, 3) / 2;
        camera.position.lerpVectors(a.startPos, a.endPos, ease);
        controls.target.lerpVectors(a.startTarget, a.endTarget, ease);
        if (a.t >= 1) state.cameraAnim = null;
      }
      controls.update();

      // 2. Làm mờ / hiện mặt tiền ngôi nhà mượt mà (Cutaway)
      const diffCut = state.cutawayTarget - state.cutawayCurrent;
      if (Math.abs(diffCut) > 0.002) {
        state.cutawayCurrent += diffCut * Math.min(1, dt * 5.2);
        const alpha = 1 - state.cutawayCurrent;
        cutawayGroup.visible = alpha > 0.04;
        for (let i = 0; i < cutawayMaterials.length; i++) {
          const m = cutawayMaterials[i];
          const baseOp = m.userData.baseOpacity;
          m.opacity = baseOp * alpha;
          const needTrans = alpha < 0.99 || m.userData.baseTransparent;
          if (m.transparent !== needTrans) {
            m.transparent = needTrans;
            m.needsUpdate = true;
          }
          m.depthWrite = alpha > 0.65;
        }
      }

      // 3. Nội suy mượt ánh sáng & bầu trời theo thời điểm trong ngày
      const tp = TIME_PRESETS[state.timeOfDay];
      const lerpAmt = Math.min(1, dt * 2.4);
      skyUniforms.topColor.value.lerp(tp.skyTop, lerpAmt);
      skyUniforms.midColor.value.lerp(tp.skyMid, lerpAmt);
      skyUniforms.horizonColor.value.lerp(tp.skyHorizon, lerpAmt);
      scene.fog.color.lerp(tp.fogColor, lerpAmt);
      scene.fog.density += (tp.fogDensity - scene.fog.density) * lerpAmt;

      hemiLight.color.lerp(tp.hemiSky, lerpAmt);
      hemiLight.groundColor.lerp(tp.hemiGround, lerpAmt);
      hemiLight.intensity += (tp.hemiIntensity - hemiLight.intensity) * lerpAmt;

      dirLight.color.lerp(tp.dirColor, lerpAmt);
      dirLight.intensity += (tp.dirIntensity - dirLight.intensity) * lerpAmt;
      dirLight.position.lerp(tp.dirPos, lerpAmt);

      starMaterial.opacity += (tp.starsOpacity - starMaterial.opacity) * lerpAmt;
      moonMesh.material.opacity += (tp.moonOpacity - moonMesh.material.opacity) * lerpAmt;
      moonHalo.material.opacity += (tp.moonOpacity * 0.82 - moonHalo.material.opacity) * lerpAmt;
      renderer.toneMappingExposure += (tp.exposure - renderer.toneMappingExposure) * lerpAmt;

      for (let i = 0; i < windowMaterials.length; i++) {
        windowMaterials[i].emissiveIntensity += (tp.windowEmissive - windowMaterials[i].emissiveIntensity) * lerpAmt;
      }

      // 4. Lò sưởi cháy bập bùng & ánh sáng cam vàng nhấp nháy
      for (let i = 0; i < fireFlames.length; i++) {
        const f = fireFlames[i];
        const u = f.userData;
        const flicker = Math.sin(elapsed * u.speed + u.phase) * 0.18 + Math.cos(elapsed * (u.speed * 1.4) + u.phase) * 0.1;
        f.scale.set(1 + flicker * 0.45, 1 + flicker, 1 + flicker * 0.45);
        f.rotation.z = Math.sin(elapsed * 5.2 + u.phase) * 0.12;
      }
      fireLight.intensity = 4.9 + Math.sin(elapsed * 9.5) * 0.55 + Math.cos(elapsed * 15.2) * 0.35;

      // Tàn lửa bay nhẹ lên trong lòng lò sưởi
      for (let i = 0; i < emberParticles.length; i++) {
        const e = emberParticles[i];
        const u = e.userData;
        u.life += dt * u.speed;
        if (u.life > 1) u.life = 0;
        e.position.set(
          u.baseX + Math.sin(elapsed * 4 + i) * 0.08,
          0.75 + u.life * 1.05,
          u.baseZ + Math.cos(elapsed * 3.5 + i) * 0.09
        );
        const s = Math.sin(u.life * Math.PI);
        e.scale.setScalar(Math.max(0.01, s));
      }

      // 5. Đèn lễ hội lấp lánh
      for (let i = 0; i < festiveLights.length; i++) {
        const fl = festiveLights[i];
        if (!state.festiveLightsOn) {
          if (fl.mat) fl.mat.emissiveIntensity = 0.05;
          if (fl.sprite) fl.sprite.material.opacity = 0;
        } else {
          const twinkle = 0.72 + 0.35 * Math.sin(elapsed * fl.speed + fl.phase);
          if (fl.mat) fl.mat.emissiveIntensity = fl.baseIntensity * twinkle;
          if (fl.sprite) fl.sprite.material.opacity = fl.baseOpacity * twinkle;
        }
      }

      // 6. Chuyển động tinh tế của gia đình, ghế bập bênh, cún cưng & hàng xóm
      if (rockingChairGroup) {
        rockingChairGroup.rotation.x = Math.sin(elapsed * 1.15) * 0.065;
      }
      if (puppyTail) {
        puppyTail.rotation.y = Math.sin(elapsed * 5.8) * 0.42;
      }
      if (puppyBody) {
        puppyBody.scale.y = 0.78 + Math.sin(elapsed * 2.2) * 0.035;
      }

      for (let i = 0; i < animatedCharacters.length; i++) {
        const c = animatedCharacters[i];
        const breath = Math.sin(elapsed * c.speed + c.phase);
        if (c.group.userData.bodyGroup) {
          c.group.userData.bodyGroup.scale.y = 1 + breath * 0.016;
        }
        if (c.group.userData.headGroup) {
          c.group.userData.headGroup.rotation.y = c.baseHeadYaw + Math.sin(elapsed * (c.speed * 0.55) + c.phase) * c.headYawAmp;
          c.group.userData.headGroup.rotation.x = Math.sin(elapsed * c.speed + c.phase * 1.5) * c.headPitchAmp;
        }
        if (c.bounceAmp) {
          c.group.position.y = c.baseY + Math.abs(Math.sin(elapsed * c.speed + c.phase)) * c.bounceAmp;
        }
        if (c.walkTrack) {
          const wt = c.walkTrack;
          const prevX = c.group.position.x;
          const nextX = wt.centerX + Math.sin(elapsed * wt.speed + wt.phase) * wt.range;
          c.group.position.x = nextX;
          c.group.position.y = c.baseY + Math.abs(Math.sin(elapsed * 4.5 + c.phase)) * 0.035;
          c.group.rotation.y = (nextX >= prevX) ? Math.PI / 2 : -Math.PI / 2;
        }
      }

      // 7. Khói ống khói & hơi nước tách cacao nóng
      for (let i = 0; i < smokeParticles.length; i++) {
        const sp = smokeParticles[i];
        const u = sp.userData;
        u.life += dt * u.speed;
        if (u.life >= 1) u.life = 0;
        sp.position.set(
          u.origin.x + u.life * u.driftX * 2.4 + Math.sin(elapsed * 1.2 + i) * 0.18,
          u.origin.y + u.life * 3.8,
          u.origin.z + u.life * u.driftZ * 2.0
        );
        const s = (0.45 + u.life * 1.65) * u.scaleMult;
        sp.scale.set(s, s, 1);
        sp.material.opacity = Math.sin(u.life * Math.PI) * 0.34;
      }

      for (let i = 0; i < steamParticles.length; i++) {
        const sp = steamParticles[i];
        const u = sp.userData;
        u.life += dt * 0.42;
        if (u.life >= 1) u.life = 0;
        sp.position.set(
          u.basePos.x + Math.sin(elapsed * 2.5 + u.phase) * 0.035,
          u.basePos.y + u.life * 0.36,
          u.basePos.z + Math.cos(elapsed * 2.2 + u.phase) * 0.035
        );
        const s = 0.09 + u.life * 0.14;
        sp.scale.set(s, s, 1);
        sp.material.opacity = Math.sin(u.life * Math.PI) * 0.28;
      }

      // 8. Tuyết rơi 3D nhẹ nhàng khắp khu phố
      if (snowPoints) {
        const posAttr = snowPoints.geometry.attributes.position;
        const speedMult = state.snowLevel === 'heavy' ? 1.35 : (state.snowLevel === 'light' ? 0.78 : 1.0);
        const activeCount = snowPoints.geometry.drawRange.count;
        for (let i = 0; i < activeCount; i++) {
          let x = posAttr.getX(i) + (snowVelocities[i * 3] + Math.sin(elapsed * 0.8 + i) * 0.22) * dt * speedMult;
          let y = posAttr.getY(i) + snowVelocities[i * 3 + 1] * dt * speedMult;
          let z = posAttr.getZ(i) + (snowVelocities[i * 3 + 2] + Math.cos(elapsed * 0.7 + i) * 0.18) * dt * speedMult;

          if (y < 0.05) {
            y = 24 + Math.random() * 4;
            x = (Math.random() - 0.5) * 62;
            z = (Math.random() - 0.5) * 62 + 4;
          }
          posAttr.setXYZ(i, x, y, z);
        }
        posAttr.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    /* =========================================================================
       13. KHỞI CHẠY SAU KHI TRANG TẢI HOÀN TẤT
    ========================================================================= */
    window.addEventListener('load', () => {
      try {
        initScene();
        animate();

        // Ẩn màn hình chờ mượt mà
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (loader) loader.classList.add('fade-out');
        }, 420);
      } catch (err) {
        console.error('Lỗi khởi tạo cảnh 3D:', err);
        const loader = document.getElementById('loading-screen');
        if (loader) loader.classList.add('fade-out');
        const errBox = document.getElementById('error-box');
        const errMsg = document.getElementById('error-msg');
        if (errBox && errMsg) {
          errMsg.textContent = 'Trình duyệt của bạn có thể chưa hỗ trợ WebGL hoặc gặp sự cố tải thư viện 3D. Vui lòng thử tải lại trang.';
          errBox.classList.remove('hidden');
        }
      }
    });
  </script>
</body>
